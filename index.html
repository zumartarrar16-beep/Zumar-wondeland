```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zumar Craft</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#87ceeb;color:#243047}
header{text-align:center;padding:15px;background:#6c49cb;color:white}
header h1{margin:5px}
#toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;background:#fff}
button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;font-weight:bold}
button.selected{outline:3px solid #ff70ae}
#game{max-width:950px;margin:15px auto;padding:10px}
#stats{text-align:center;font-weight:bold;margin:12px}
#world{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;background:#60462e;padding:5px;border:5px solid #60462e;border-radius:8px}
.block{aspect-ratio:1;min-width:0;border:1px solid #0002;padding:0;font-size:clamp(10px,3vw,24px);border-radius:2px;display:flex;align-items:center;justify-content:center}
.grass{background:#65bd45}
.dirt{background:#a66c42}
.stone{background:#9ca3af}
.water{background:#35b8ee}
.wood{background:#9b6638}
.leaves{background:#278747}
.brick{background:#cf6c62}
.sand{background:#f5d887}
#message{background:white;padding:12px;border-radius:10px;text-align:center}
@media(max-width:500px){#world{gap:1px;padding:2px}.block{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>⛏️ ZUMAR CRAFT</h1>
<p>Build your own block world!</p>
</header>

<div id="toolbar">
<button data-block="grass" class="selected">🌱 Grass</button>
<button data-block="dirt">🟫 Dirt</button>
<button data-block="stone">🪨 Stone</button>
<button data-block="wood">🪵 Wood</button>
<button data-block="leaves">🌳 Leaves</button>
<button data-block="brick">🧱 Brick</button>
<button data-block="sand">🏖️ Sand</button>
<button data-block="water">💧 Water</button>
<button id="erase">🧹 Eraser</button>
<button id="save">💾 Save</button>
<button id="reset">🔄 New World</button>
</div>

<main id="game">
<div id="stats">Blocks placed: <span id="count">0</span></div>
<div id="world" aria-label="Minecraft-style building grid"></div>
<p id="message">Choose a block, then tap a square to build!</p>
</main>

<script>
(function(){
const world=document.getElementById("world");
const count=document.getElementById("count");
const message=document.getElementById("message");
const size=16;
let selected="grass";
let erasing=false;
let map=[];

const symbols={
grass:"🌱",dirt:"🟫",stone:"🪨",water:"💧",
wood:"🪵",leaves:"🌳",brick:"🧱",sand:"🏖️"
};

function makeWorld(){
world.innerHTML="";
map=[];
for(let row=0;row<size;row++){
 for(let col=0;col<size;col++){
  const block=document.createElement("button");
  block.type="button";
  block.className="block grass";
  block.setAttribute("aria-label","Empty building square");
  block.dataset.type="";
  block.addEventListener("click",function(){
   if(erasing){
    block.className="block";
    block.textContent="";
    block.dataset.type="";
    block.setAttribute("aria-label","Empty building square");
    message.textContent="🧹 Block removed!";
   }else{
    block.className="block "+selected;
    block.textContent=symbols[selected];
    block.dataset.type=selected;
    block.setAttribute("aria-label",selected+" block");
    message.textContent="✨ You placed a "+selected+" block!";
   }
   updateCount();
  });
  map.push(block);
  world.appendChild(block);
 }
}
updateCount();
}

function updateCount(){
count.textContent=map.filter(block=>block.dataset.type).length;
}

document.querySelectorAll("[data-block]").forEach(button=>{
button.addEventListener("click",()=>{
selected=button.dataset.block;
erasing=false;
document.querySelectorAll("[data-block]").forEach(b=>b.classList.toggle("selected",b===button));
document.getElementById("erase").classList.remove("selected");
message.textContent="Selected "+selected+". Tap the world to build!";
});
});

document.getElementById("erase").addEventListener("click",()=>{
erasing=true;
document.querySelectorAll("[data-block]").forEach(b=>b.classList.remove("selected"));
document.getElementById("erase").classList.add("selected");
message.textContent="🧹 Tap any square to remove its block.";
});

document.getElementById("save").addEventListener("click",()=>{
try{
localStorage.setItem("zumarCraftWorld",JSON.stringify(map.map(b=>b.dataset.type)));
message.textContent="💾 Your world has been saved on this device!";
}catch(e){
message.textContent="Sorry, this browser could not save your world.";
}
});

function loadWorld(){
try{
const saved=JSON.parse(localStorage.getItem("zumarCraftWorld")||"null");
if(!Array.isArray(saved)||saved.length!==map.length)return;
map.forEach((block,i)=>{
const type=saved[i];
if(symbols[type]){
block.className="block "+type;
block.textContent=symbols[type];
block.dataset.type=type;
}
});
updateCount();
}catch(e){}
}

document.getElementById("reset").addEventListener("click",()=>{
if(confirm("Start a new world? This clears your current blocks.")){
localStorage.removeItem("zumarCraftWorld");
makeWorld();
message.textContent="🌍 A new world is ready!";
}
});

makeWorld();
loadWorld();
})();
</script>
</body>
</html>
